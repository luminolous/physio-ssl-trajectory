encoder_config: configs/pretrain/encoder.yaml
windows_config: configs/pretrain/unlabeled_windows.yaml
raw_variant: broadband_car
cleaned_variant: broadband_ica_car
seed: 0
variants:
  lejepa_guided:
    objective: lejepa
    guided: true
  lejepa_unguided:
    objective: lejepa
    guided: false
  jepa_guided:
    objective: jepa
    guided: true
  jepa_unguided:
    objective: jepa
    guided: false
  mae:
    objective: mae
    guided: false
objective:
  lam: 0.02
  lambda_gate: 0.1
  mask_ratio:
  - 0.3
  - 0.5
  ema:
  - 0.996
  - 1.0
  predictor:
    d_model: 64
    n_layers: 2
    n_heads: 4
    mlp_width: 128
    dropout: 0.0
  sigreg:
    n_slices: 1024
    t_max: 3.0
    n_points: 17
train:
  steps: 12000
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.05
  warmup_frac: 0.05
  grad_clip: 1.0
  amp: bf16
  log_every: 50
  health_every: 1000
  checkpoint_every: 3000
probe:
  cache_dir: dataset/cache/98f5fa6e66
  subjects:
  - P3
  - P6
  pairs:
  - - - P3
    - - P6
  - - - P6
    - - P3
  stride: 20
  alpha: 1.0
  n_permutations: 5
smoke: false
variant:
  name: lejepa_guided
  objective: lejepa
  guided: true
encoder:
  prior_config: configs/pretrain/physio_prior.yaml
  n_chans: 32
  window: 200
  patch: 20
  d_model: 128
  n_layers: 4
  n_heads: 4
  mlp_width: 256
  dropout: 0.1
  n_filters: 16
  kernel: 25
  depth_multiplier: 2
windows:
  cache_dir: dataset/cache/98f5fa6e66
  subjects:
  - P1
  - P2
  - P3
  - P4
  - P5
  - P6
  - P7
  - P8
  - P9
  - P10
  - P11
  - P12
  variants:
  - broadband_car
  sources:
  - lift
  - between
  - st
  window: 200
  stride: 50
  strict_per_fold: false
  exclude_subject: null
prior:
  values:
    high: 0.9
    medium: 0.6
    low: 0.2
  groups:
    midline_central:
      level: high
      channels:
      - Cz
    left_sensorimotor:
      level: high
      channels:
      - FC1
      - FC5
      - C3
      - CP1
      - CP5
    right_sensorimotor:
      level: medium
      channels:
      - FC2
      - FC6
      - C4
      - CP2
      - CP6
    prefrontal:
      level: low
      channels:
      - Fp1
      - Fp2
    others:
      level: medium
      channels:
      - F7
      - F3
      - Fz
      - F4
      - F8
      - T7
      - T8
      - TP9
      - TP10
      - P7
      - P3
      - Pz
      - P4
      - P8
      - PO9
      - O1
      - Oz
      - O2
      - PO10
sweep: true
