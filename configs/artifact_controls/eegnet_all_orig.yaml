# ARTIFACT CONTROL (baselines.md): all-channel reference model under the orig reference
# Same model and settings as configs/baselines/eegnet.yaml; only the input differs.
# Run 3 seeds (--seed 1/2/3) per the deep-model protocol; summarize mean +- SD.
baseline:
  name: eegnet
  params:
    model:
      # Default kernel_length 64 assumes 128 Hz and exceeds the 50-sample window; set to
      # fs/2 = 50 samples (the EEGNet paper's rule). Other settings are braindecode defaults.
      kernel_length: 50
    train:  # fixed budget, no hyperparameter search
      lr: 0.001
      weight_decay: 0.01
      batch_size: 512
      max_epochs: 30
      samples_per_epoch: 200000
      val_samples: 100000
      patience: 5
      amp: true
data:
  windows_config: configs/data/windows.yaml  # history 50 samples (500 ms), causal
  band: broadband  # D4: 0.1-40 Hz for deep models
  reference: orig  # D5: controls run under car and orig
  channel_set: all
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 1
save_predictions: false
exclude_flags: []
output:
  group: artifact-controls
  name: eegnet_all_orig
