# Physiological prior (design.md, "Physiological prior"): target-view weights w_phys and gate prior g_prior.
# Decided by the user on 2026-11-15 (option A), before any SSL result. Not tuned on test folds.
# One vector serves both: w_phys multiplies the z-scored ICA-cleaned target view per channel; g_prior initializes the
# 32 sigmoid gate weights and is the centre of the L2 pull. "high" stays below 1 because the gate is a sigmoid.
values:
  high: 0.9
  medium: 0.6
  low: 0.2
groups:  # every one of the 32 channels exactly once
  midline_central: {level: high, channels: [Cz]}
  left_sensorimotor: {level: high, channels: [FC1, FC5, C3, CP1, CP5]}  # contralateral to the right hand
  right_sensorimotor: {level: medium, channels: [FC2, FC6, C4, CP2, CP6]}
  prefrontal: {level: low, channels: [Fp1, Fp2]}
  others: {level: medium, channels: [F7, F3, Fz, F4, F8, T7, T8, TP9, TP10, P7, P3, Pz, P4, P8, PO9, O1, Oz, O2, PO10]}
