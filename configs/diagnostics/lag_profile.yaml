# Lag profile: single-lag ridge on 0.1-2 Hz EEG, LOSO. Analysis only, outside the causal protocol.
# Positive lag = EEG before the kinematic sample; negative = EEG after it. Never report these as decoders.
cache_dir: dataset/cache/98f5fa6e66
splits_config: configs/splits/default.yaml
target: position
reference: car
eeg_normalization: per_subject  # D9
bands:
  causal: mrcp  # the cached causal filter, as a decoder would see it
  zero_phase: mrcp_zp  # forward-backward filter, true timing
channel_sets: [all, sensorimotor, prefrontal]
lags_ms: {min: -500, max: 1000, step: 20}
alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
exclude_flags: []
scoring:  # same as inner_val_scoring of the screening runs
  seed: 20261106
  n_permutations: 5
