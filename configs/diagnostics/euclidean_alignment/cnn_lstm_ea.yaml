# Euclidean alignment: CNN-LSTM, broadband, all channels, 2 s history, fixed budget (D11).
# Same as configs/diagnostics/screening/broadband__all.yaml (the run without alignment) plus euclidean_alignment.
baseline:
  name: cnn_lstm
  params:
    model:
      n_temporal: 8
      temporal_kernel: 25
      n_spatial: 16
      pool: 2
      hidden: 32
      lstm_layers: 1
      drop_prob: 0.25
    train:
      lr: 0.001
      weight_decay: 0.01
      batch_size: 512
      max_epochs: 30
      samples_per_epoch: 200000
      val_samples: 100000
      patience: 5
      amp: true
data:
  windows_config: configs/data/windows_long_history.yaml
  band: broadband
  reference: car
  channel_set: all
  euclidean_alignment: true  # per-subject whitening by the mean lift covariance, label-free (transductive, like D9)
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 1
save_predictions: true
exclude_flags: []
inner_val_scoring:  # the clean selection readout
  seed: 20261106
  n_permutations: 5
output:
  root: output/diagnostics/pre-design
  group: euclidean-alignment
  name: cnn_lstm_ea
