# History-length ablation, EEGNet, fixed lr 1e-3 (user decision for this ablation only).
# Pick the history with --history-samples. Model and training settings match configs/baselines/eegnet.yaml.
baseline:
  name: eegnet
  params:
    model:
      kernel_length: 50
    train:
      lr: 0.001
      weight_decay: 0.01
      batch_size: 512
      max_epochs: 30
      samples_per_epoch: 200000
      val_samples: 100000
      patience: 5
      amp: true
data:
  windows_config: configs/data/windows_long_history.yaml
  band: broadband
  reference: car
  channel_set: all
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 1
save_predictions: true
exclude_flags: []
output:
  root: output/diagnostics
  group: history
  name: eegnet
