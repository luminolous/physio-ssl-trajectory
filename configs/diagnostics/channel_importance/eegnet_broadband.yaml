# Channel importance: EEGNet, broadband, all channels, 2 s history, fixed budget (D11). Retrained because the earlier runs saved no weights.
baseline:
  name: eegnet
  params:
    model:
      kernel_length: 50
    train:
      lr: 0.001
      weight_decay: 0.01
      batch_size: 512
      max_epochs: 30
      samples_per_epoch: 200000
      val_samples: 100000
      patience: 5
      amp: true
data:
  windows_config: configs/data/windows_long_history.yaml
  band: broadband
  reference: car
  channel_set: all
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 1
save_predictions: true
save_model: true
exclude_flags: []
inner_val_scoring:
  seed: 20261106
  n_permutations: 5
channel_occlusion:  # test subjects; each channel and group set to its normalizer mean (zero after z-score)
  seed: 20261106
  n_permutations: 5
  groups:
    prefrontal: [Fp1, Fp2]
    contralateral: [C3, FC5, FC1, CP5, CP1, Cz]
    ipsilateral: [C4, FC6, FC2, CP6, CP2, Cz]
    occipital: [O1, Oz, O2, PO9, PO10]
output:
  root: output/diagnostics/pre-design
  group: channel-importance
  name: eegnet_broadband
