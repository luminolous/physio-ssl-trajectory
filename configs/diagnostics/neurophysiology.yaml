# Neurophysiology sanity check (pre-design checks). No training.
# All analysis windows are fixed here before any result was looked at.
cache_dir: dataset/cache/98f5fa6e66
cache_config: configs/cache/default.yaml
output_dir: output/diagnostics/pre-design/neurophysiology
subjects: [P1, P2, P4, P5, P7, P8, P9, P10, P11, P12]  # LOSO subjects; P3 and P6 stay out
reference: car

erp:
  band: mrcp  # 0.1-2 Hz, slow potentials
  band_hz: [0.1, 2.0]
  fast_band: broadband  # 0.1-40 Hz, for the visual evoked response, too fast for the MRCP band
  baseline_led_s: [-1.5, -0.5]  # relative to LED-on, for both alignments
  epochs_s:
    onset: [-2.0, 2.0]
    led: [-1.5, 2.5]

tf:
  band: broadband
  freqs_hz: {start: 4.0, stop: 35.0, step: 1.0}
  n_cycles_per_hz: 0.5  # constant temporal SD of about 80 ms
  edge_s: 0.25  # about 3 SD; power this close to the start or end of the available EEG is dropped
  min_lift_fraction: 0.5  # a map cell needs this fraction of lifts
  baseline_led_s: [-1.5, -0.5]
  epochs_s:
    onset: [-2.0, 6.0]
    led: [-1.5, 6.0]
    tHandStop: [-2.0, 0.8]

bands_hz:
  mu: [8.0, 12.0]
  beta: [13.0, 30.0]

windows_s:  # relative to kinematic onset
  mrcp: [-0.5, 0.0]
  erd_pre: [-0.5, 0.0]
  erd_move: [0.0, 1.0]
rebound_s: [0.0, 0.5]  # relative to tHandStop, limited by the end of the lift window

laterality:
  pair: [C3, C4]
  contralateral: [C3, FC5, FC1, CP5, CP1]  # left hemisphere; Cz excluded because it has no side
  ipsilateral: [C4, FC6, FC2, CP6, CP2]

plots:
  mrcp_channels: [Cz, C3, C4]
  occipital_channels: [O1, Oz, O2]
  prefrontal_channels: [Fp1, Fp2]
  tf_channels: [C3, C4]

rt_split:
  fraction: 0.3333333  # fastest and slowest third of each subject's lifts
  channels: [Cz, C3, Fp1]
  peak_window_s:  # most negative point of the average
    led: [0.0, 2.0]
    onset: [-0.5, 1.5]

filter_delay_hz: [0.5, 1.0, 2.0]

# Added after the first run (20261106-132130) showed a left-right gradient across the whole scalp. Exploratory.
asymmetry:
  reference_pair: [C3, C4]
  ocular_pair: [F7, F8]  # the data have no EOG channel; F7-F8 is the closest proxy for horizontal eye movement
  orig_band: lowfreq  # the original-reference cache has 0.1-4 Hz, not the MRCP band
  orig_window: pre_onset
  windows_s:
    pre_led: [led, [-0.4, 0.0]]
    pre_onset: [onset, [-0.5, 0.0]]
    move: [onset, [0.0, 0.5]]
  pairs:
    - [Fp1, Fp2]
    - [F7, F8]
    - [F3, F4]
    - [FC5, FC6]
    - [FC1, FC2]
    - [T7, T8]
    - [C3, C4]
    - [CP5, CP6]
    - [CP1, CP2]
    - [TP9, TP10]
    - [P7, P8]
    - [P3, P4]
    - [PO9, PO10]
    - [O1, O2]
