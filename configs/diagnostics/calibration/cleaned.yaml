# Calibration within subject (final pre-design checks). Data: ocular-cleaned by ICA.
# Calibration lifts from S1-S5, early stopping on S6, test on S7-S9 (D6 within-subject split).
# Grid and fine-tune lr approved by the user on 2026-11-08 (k in {10, 30, all}, fixed fine-tune lr 3e-4).
data:
  windows_config: configs/data/windows_long_history.yaml
  band: broadband_ica
  reference: car
  channel_set: all
splits:
  config: configs/splits/default.yaml
pretrained: output/diagnostics/final-checks/calibration/loso_residual_ica  # newest non-smoke run with models/
conditions: [template, no_calibration, finetune, scratch]
ks: [10, 30, all]
n_draws: {10: 3, 30: 3}  # other k: 1 draw
draw_seed: 20261108
seed: 1
train:  # shared budget (D11), one epoch = one pass over the calibration windows (at most 200k)
  weight_decay: 0.01
  batch_size: 512
  max_epochs: 30
  samples_per_epoch: 200000
  val_samples: 10000
  patience: 5
  amp: true
lr:
  finetune: 0.0003
  scratch: 0.001  # D11, training from random weights
scoring:
  seed: 20261106
  n_permutations: 5
output:
  root: output/diagnostics/final-checks
  group: calibration
  name: cleaned
