# Kalman R^2 check. Same data, split, and model settings as configs/baselines/kalman.yaml.
baseline:
  name: kalman
  params:
    n_components: [10, 20, 50]
data:
  windows_config: configs/data/windows.yaml
  band: lowfreq
  reference: car
  channel_set: all
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 20261029
exclude_flags: []
# Folds to refit. P11 has the worst Kalman R^2 (-6.33); P1 is near the typical value (-2.47).
subjects: [P1, P11]
diagnostics:
  # Existing runs analyzed read-only. Deep models: first seed.
  source_runs:
    kalman: output/data-baselines/baselines/kalman/20261030-035949
    ridge_lag: output/data-baselines/baselines/ridge_lag/20261030-034531
    eegnet: output/data-baselines/baselines/eegnet/20261030-042902_seed1
    cnn_lstm: output/data-baselines/baselines/cnn_lstm/20261030-054018_seed1
    template: output/data-baselines/baselines/template/20261029-184451
  trace_subjects: [P1, P11]
  trace_trials_per_subject: 3  # evenly spaced trial rows, not picked by score
  time_bin_s: 0.25
  time_max_s: 6.0
  # Counterfactuals, diagnostic only: observation noise R multiplied by these factors.
  r_scales: [1, 3, 10, 30, 100, 300, 1000]
  autocorr_lags_samples: [1, 10, 50]
  n_train_subjects_scored: 1  # also score the filter on training subjects (no transfer gap)
