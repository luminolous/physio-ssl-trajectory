# Ocular-cleaned variant (final pre-design checks), CNN-LSTM, 2 s history, fixed budget (D11).
# Seed 1 of cnn_lstm_direct plus occlusion. Uncleaned occlusion: output/diagnostics/pre-design/channel-importance/cnn_lstm_broadband/.
baseline:
  name: cnn_lstm
  params:
    model:
      n_temporal: 8
      temporal_kernel: 25
      n_spatial: 16
      pool: 2
      hidden: 32
      lstm_layers: 1
      drop_prob: 0.25
    train:
      lr: 0.001
      weight_decay: 0.01
      batch_size: 512
      max_epochs: 30
      samples_per_epoch: 200000
      val_samples: 100000
      patience: 5
      amp: true
data:
  windows_config: configs/data/windows_long_history.yaml
  band: broadband_ica  # ocular-cleaned by ICA per subject
  reference: car
  channel_set: all
splits:
  config: configs/splits/default.yaml
  mode: loso
seed: 1
save_predictions: true
exclude_flags: []
inner_val_scoring:  # the clean selection readout
  seed: 20261106
  n_permutations: 5
channel_occlusion:  # seed 1 only (cnn_lstm_direct_occlusion.yaml); seeds 2-3 use cnn_lstm_direct.yaml
  seed: 20261106
  n_permutations: 5
  groups:
    prefrontal: [Fp1, Fp2]
    contralateral: [C3, FC5, FC1, CP5, CP1, Cz]
    ipsilateral: [C4, FC6, FC2, CP6, CP2, Cz]
    occipital: [O1, Oz, O2, PO9, PO10]
output:
  root: output/diagnostics/final-checks
  group: ocular
  name: cnn_lstm_direct
