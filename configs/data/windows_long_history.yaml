# Windowing at the protocol history (D3, 2 s), which is longer than the lift window allows.
# Same as windows.yaml, plus EEG before each lift from configs/cache/pre_lift.yaml.
cache_dir: dataset/cache/98f5fa6e66
history_samples: 200  # D3; --history-samples overrides it for diagnostics
pre_lift: true
ridge_lag_step_samples: 2  # unused by deep models
target: position
eeg_normalization: per_subject  # statistics from the lift samples only, as in the main runs
